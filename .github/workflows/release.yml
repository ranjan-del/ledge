name: Release

# Builds the desktop app on macOS, Windows and Linux when a `v*` tag is pushed and attaches the
# installers (.dmg, .msi, .AppImage, .deb) to a draft GitHub Release. Publish the draft by hand
# after the manual QA checklist in docs/manual-qa.md has been run on each OS.
#
# Action inputs verified against https://github.com/tauri-apps/tauri-action (README and
# action.yml): `projectPath` for an app that is not at the repo root, `tagName`, `releaseName`,
# `releaseBody`, `releaseDraft`, `prerelease`, `args`. The README's own example pins `@v1`.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # https://github.com/dtolnay/rust-toolchain: `targets` is a comma separated list of
      # extra target triples. Only the macOS runner needs both Apple targets.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tauri 2 Linux prerequisites: https://v2.tauri.app/start/prerequisites/
      - name: Install Tauri prerequisites (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install workspace dependencies
        run: npm ci

      - name: Build and upload to a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ledge ${{ github.ref_name }}"
          releaseBody: "See the assets below for the installer for your operating system. Release notes are in CHANGELOG.md."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
